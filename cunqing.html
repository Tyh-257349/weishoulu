<div class="wrap">
  <div class="panel">
    <figure style="margin:0 0 20px">
      <img src="assets/cunqing-village.jpg" alt="林家村旧貌" style="width:100%; display:block; box-shadow:0 6px 20px rgba(80,60,20,.25)">
      <figcaption style="text-align:center; color:var(--ink-light); font-size:.82rem; margin-top:8px; font-family:'FangSong','仿宋',serif">
        林家村旧貌（摄于村东，想象复原图）
      </figcaption>
    </figure>
    <p style="text-indent:2em">
      林家村位于山东省掖县西南部，全村现有住户三百一十二户，人口一千零四十人，耕地面积二千六百亩。
      本村以种植小麦、玉米为主，兼营果树。
    </p>
    <p style="text-indent:2em; margin-top:12px">
      林家村建村于明初，村民多姓林。清咸丰年间曾修<span class="hl">《林氏族谱》</span>，现存残本，存于村档案室。
    </p>
    <p style="text-indent:2em; margin-top:12px">
      建国以来，本村共有三十七人参军入伍，一人牺牲于抗美援朝战场。
      烈士名录详见光荣榜及村志大事记。
    </p>
  </div>

  <div class="panel">
    <p style="font-size:.9rem; color:var(--ink-light)">
      光荣榜上，一九四七年入伍的有两个名字。其中一个，被人用墨涂去了。<br>
      <span style="color:var(--red)">另一个是谁？</span>
    </p>
