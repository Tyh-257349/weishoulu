    「爹走的那年冬天，娘连夜纳了一双布鞋，千层底，没来得及寄。<br>

  </p>

          <textPath href="#arc-top" startOffset="11%">中 国 人 民 志 愿 军</textPath>
        </text>
        <text font-size="10.5" fill="#8e3a2c" letter-spacing="1.5">
          <textPath href="#arc-bot" startOffset="10%">沈 阳 · 一九五一年 — 二〇二五年</textPath>
        </text>
        <text x="85" y="84" text-anchor="middle" font-size="25" fill="#8e3a2c" font-family="KaiTi,楷体,cursive">已寄达</text>
