<div class="wrap">
  <div class="panel">
    <p style="text-indent:2em">
      爷的遗物里有一只木匣。木匣底层，压着一个牛皮纸档案袋，
      袋口的线绳缠了很多道，像怕里面的东西跑出来。
    </p>
    <p style="text-indent:2em; margin-top:10px">
      袋面上有褪色的蓝黑印迹，只剩几个字认得出来：<strong>"……部　队"</strong>。
      村里上了年纪的人说，这是一九五二年，部队上的人从东北捎回来的，
      交到林家，再没有人打开过。
    </p>
    <p style="text-indent:2em; margin-top:10px">
      你把它打开了。里面是三封信，一册日记。
    </p>
  </div>

  <div class="panel">
    <div id="chest3d-inline" class="viewer3d" style="height:420px">
      <p id="chest3d-loading">木匣还在匣底，稍等……</p>
    </div>
    <p style="text-align:center; color:var(--ink-light); font-size:.88rem; margin-top:6px">
      拖动，转着看看这只木匣。铜扣、裂缝，和磨秃的边角。<br>
      <strong style="color:var(--ink); letter-spacing:.1em">点击匣内，看看压在匣底的东西。</strong>
    </p>
  </div>
