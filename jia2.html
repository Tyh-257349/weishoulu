<div class="wrap">
  <div class="letter-paper">
    <div class="l-date">一九五〇年十一月十四日　行军途中</div>
    <p>爹，娘：</p>
    <p>进山十几天了，雪没过膝盖。连里分的一袋地瓜干，早分完了。夜里想娘蒸的饽饽。</p>
    <p>指导员不让说苦。儿不觉得苦，就是冷。等打完仗回家，娘给儿留一锅。</p>
    <div class="l-sign">儿　守拙</div>
  </div>

  <button class="flip-btn" id="flip-btn">翻到信封背面</button>
  <div class="envelope-back" id="env-back">
    守拙识字不多，此信由我代笔。<br>
    他在部队一切都好，身体结实，请家里切勿挂念。<br>
    <span style="float:right">——连指导员　十一月十四日</span>
  </div>

  <p class="puzzle-note" style="margin-top:18px">这行字是指导员代笔的。怕他娘惦记。</p>
