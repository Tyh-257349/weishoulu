    <p>爹，娘：</p>
    <p>部队到安东了，休整两天。这里已经冷得伸不出手，棉袄发下来了，是新的，厚。勿念。</p>
    <p>部队有纪律，不让说往哪里去，儿也不问。等打完仗，儿回家帮爹收秋。</p>
